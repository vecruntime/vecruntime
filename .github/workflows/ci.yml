# Build and test on every push to main and every pull request: the four modules' suites (kernels,
# spark, shuffle, benchmarks) with the Comet and Iceberg suites included, Spotless bound to verify.
# Spark's own SQL golden-file suite is a separate, manually triggered workflow (spark-sql-tests.yml):
# it takes ~15 minutes on its own and is a coverage check rather than a pass/fail gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Both supported Spark lines (#639). 4.1 also runs the Comet and Iceberg suites; neither publishes
    # Spark 4.2 artifacts yet. Each job is its own checkout, and `clean` runs first anyway: the
    # incremental Scala compiler would reuse classes compiled against the other line.
    name: build and test (Spark ${{ matrix.line }}, JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: '4.1'
            profiles: comet,iceberg
          - line: '4.2'
            profiles: spark-4.2
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, check formatting, run the suites
        # -Pcomet,iceberg: also the Comet-backed and Iceberg suites (docs/comet.md, docs/iceberg.md).
        # The Spark suites fork a JVM with -Xmx3g each (spark/pom.xml); the runner has 16 GB.
        env:
          MAVEN_OPTS: -Xmx2g
        run: mvn -B -ntp -P${{ matrix.profiles }} clean verify

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-spark-${{ matrix.line }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/target/surefire-reports/
            **/target/scalatest-reports/
