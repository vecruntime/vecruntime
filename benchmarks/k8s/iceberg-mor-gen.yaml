# Generate an Iceberg merge-on-read warehouse ON THE CLUSTER, to S3, from lineitem Parquet already on
# S3 (s3a://S3_BUCKET/DATA_PREFIX/lineitem). Distributed generation — the single-JVM IcebergMorGenerator
# path does not scale to 100 GB. The catalog uses S3FileIO with its own stream, the Analytics Accelerator
# off (IcebergMorGenerator.catalogConf detects the s3a warehouse; #835). Rendered by run-iceberg-mor.sh.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: vecruntime-mor-gen-NAMESPACE
  namespace: bench
spec:
  type: Scala
  mode: cluster
  image: IMAGE
  imagePullPolicy: IfNotPresent
  mainClass: io.vecruntime.benchmarks.IcebergMorGenerator
  mainApplicationFile: local:///opt/spark/jars/benchmarks.jar
  arguments:
    - "--data"
    - "s3a://S3_BUCKET/DATA_PREFIX"                 # the directory holding lineitem/
    - "--warehouse"
    - "s3a://S3_BUCKET/iceberg-mor/NAMESPACE"    # the S3 warehouse to create
    - "--namespace"
    - "NAMESPACE"                                # v2 or v3 (which variant set)
    - "--base-table"
    - "BASE_TABLE"
    - "--variants"
    - "VARIANTS"
    - "--files"
    - "FILES"
    - "--sample-frac"
    - "SAMPLE_FRAC"
    - "--clean"
  sparkVersion: "4.1.3"
  sparkConf:
    spark.sql.adaptive.enabled: "true"
    spark.sql.shuffle.partitions: "300"
    spark.hadoop.fs.s3a.connection.maximum: "200"
    spark.hadoop.fs.s3a.aws.credentials.provider: "software.amazon.awssdk.auth.credentials.WebIdentityTokenFileCredentialsProvider"
    spark.driver.extraJavaOptions: >-
      --add-modules=jdk.incubator.vector --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow
      --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED
      --add-opens=java.base/sun.nio.ch=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true
    spark.executor.extraJavaOptions: >-
      --add-modules=jdk.incubator.vector --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow
      --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED
      --add-opens=java.base/sun.nio.ch=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true
  restartPolicy:
    type: Never
  driver:
    cores: 1
    memory: "3g"
    serviceAccount: sfi-engine
    nodeSelector:
      workload: "spark-xl"
    volumeMounts:
      - name: tmp
        mountPath: /tmp
  executor:
    instances: 8
    cores: 14
    memory: "40g"
    memoryOverhead: "12g"
    serviceAccount: sfi-engine
    nodeSelector:
      workload: "spark-xl"
    volumeMounts:
      - name: tmp
        mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
