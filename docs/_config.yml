title: vecruntime
description: >-
  A vectorized execution runtime for Apache Spark SQL using Java
# GitHub Pages serves this project site under /vecruntime.
baseurl: "/vecruntime"
url: "https://vecruntime.github.io"

repo_url: "https://github.com/vecruntime/vecruntime"

# Stock GitHub Pages Jekyll: no custom plugins, no theme gem. We ship our own
# layouts/includes/assets so nothing outside the allowed plugin set is used.
theme: null
plugins: []

# The benchmark pages under benchmarks/ are self-contained HTML documents with
# their own <head>/<body> and no front matter, so Jekyll copies them verbatim
# (static files) -- they are never wrapped in a layout or run through Liquid.
exclude:
  - Gemfile
  - Gemfile.lock

# Left-sidebar navigation tree, Comet-style sections. Each item: title + url
# (relative to baseurl). external: true renders an offsite link.
nav:
  - section: Overview
    items:
      - title: Introduction
        url: /index.html
  - section: User guide
    items:
      - title: Supported operators
        url: /operators.html
      - title: Supported expressions
        url: /expressions.html
      - title: Compatibility matrix
        url: /compatibility.html
      - title: Running and tuning
        url: /running.html
      - title: Configuration reference
        url: /configuration.html
      - title: How it works
        url: /how-it-works.html
      - title: Comet as the scan
        url: /comet.html
      - title: Apache Iceberg
        url: /iceberg.html
      - title: Flight shuffle
        url: /flight-shuffle.html
  - section: Testing
    items:
      - title: Testing & correctness
        url: /testing.html
      - title: Running the benchmarks
        url: /benchmarking.html
  - section: Benchmarks
    items:
      - title: Results (lab notebook)
        url: /results.html
      - title: "TPC-DS 1 TB (x86)"
        url: /benchmarks/tpcds-1tb.html
      - title: "TPC-DS 1 TB (Graviton4)"
        url: /benchmarks/tpcds-1tb-graviton.html
      - title: "Iceberg merge-on-read"
        url: /benchmarks/iceberg-mor.html
